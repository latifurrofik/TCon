name: TCon cloud Shorts production

on:
  workflow_dispatch:
    inputs:
      overwrite_images:
        description: Regenerate existing scene images
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  produce-episode-01:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Remotion dependencies
        run: |
          npm install
          npx remotion browser ensure

      - name: Install media dependencies
        run: python -m pip install -r requirements-media.txt

      - name: Generate scene illustrations (free AI Horde)
        env:
          OVERWRITE_IMAGES: ${{ inputs.overwrite_images }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
        run: python scripts/generate_images.py

      - name: Generate Indonesian narration and timed subtitles
        run: python scripts/generate_voice.py

      - name: TypeScript validation
        run: npm run typecheck

      - name: Render vertical Shorts MP4
        run: npm run render:episode-01:assets

      - name: Upload rendered video and assets
        uses: actions/upload-artifact@v4
        with:
          name: tcon-episode-01-preview
          path: |
            out/episode-01.mp4
            data/episode-01-audio.json
            public/images/episode-01/
            public/audio/episode-01/
          if-no-files-found: error
          retention-days: 7
