name: Remotion validation

on:
  push:
    branches: [feat/remotion-shorts-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image analysis dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: List Remotion compositions
        run: npx remotion compositions src/index.ts --gl=swiftshader
      - name: Render 10-second Three.js prototype
        run: npm run render:three:prototype
      - name: Upload Three.js preview
        uses: actions/upload-artifact@v4
        with:
          name: tcon-threejs-prototype
          path: out/three-prototype.mp4
          if-no-files-found: error
          retention-days: 7
