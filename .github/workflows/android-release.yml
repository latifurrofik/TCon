name: Android signed release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Semantic version, for example 0.1.1"
        required: true
        type: string
      version_code:
        description: "Android versionCode; must increase for every release"
        required: true
        type: number
      release_tag:
        description: "Git tag, for example v0.1.1"
        required: true
        type: string
      release_notes:
        description: "Short release notes"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate release version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$RELEASE_TAG" = "v$VERSION_NAME"
          test "$VERSION_CODE" -gt 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TCON_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tcon-release.jks"
          test -s "$RUNNER_TEMP/tcon-release.jks"

      - name: Build and test signed release APK
        working-directory: android-companion
        env:
          TCON_RELEASE_STORE_FILE: ${{ runner.temp }}/tcon-release.jks
          TCON_RELEASE_STORE_PASSWORD: ${{ secrets.TCON_RELEASE_STORE_PASSWORD }}
          TCON_RELEASE_KEY_ALIAS: ${{ secrets.TCON_RELEASE_KEY_ALIAS }}
          TCON_RELEASE_KEY_PASSWORD: ${{ secrets.TCON_RELEASE_KEY_PASSWORD }}
          TCON_VERSION_NAME: ${{ inputs.version_name }}
          TCON_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test -n "$TCON_RELEASE_STORE_PASSWORD"
          test -n "$TCON_RELEASE_KEY_ALIAS"
          test -n "$TCON_RELEASE_KEY_PASSWORD"
          gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare APK asset
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          mkdir -p release-assets
          cp android-companion/app/build/outputs/apk/release/app-release.apk "release-assets/TCon-$VERSION_NAME.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: TCon ${{ inputs.release_tag }}
          body: ${{ inputs.release_notes }}
          draft: false
          prerelease: false
          files: release-assets/TCon-${{ inputs.version_name }}.apk
